name: Test mobile push notification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Web Push library
        run: python -m pip install 'pywebpush>=2.0,<3'
      - name: Diagnose Cloudflare connection
        env:
          PUSH_API_TOKEN: ${{ secrets.PUSH_API_TOKEN }}
        run: python push_diagnostics.py
      - name: Send test notification
        env:
          PUSH_API_TOKEN: ${{ secrets.PUSH_API_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python push_delivery.py
