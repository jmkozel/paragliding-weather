name: Paragliding forecast and public web
on:
  schedule:
    # Refresh website hourly, plus 07:00 local daily.
    - cron: '17 * * * *'
    - cron: '0 5,6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: paragliding-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile forecast.py build_site.py preferences.py morning_delivery.py morning_push.py logistics.py tracking_delivery.py pwa_assets.py push_delivery.py
      - name: Build public weather report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: python build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Wait for Pages artifact to become available
        run: |
          echo "Waiting for GitHub artifact indexing before Pages deployment"
          sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          error_count: 5
          reporting_interval: 10000
      - name: Install morning Web Push library
        if: ${{ success() }}
        run: python -m pip install "pywebpush>=2.0,<3"
      - name: Send morning mobile notification
        if: ${{ success() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          PUSH_API_TOKEN: ${{ secrets.PUSH_API_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "0 5,6 * * *" ] && [ "$(TZ=Europe/Prague date +%H)" = "07" ]; then
            python morning_push.py
          else
            echo "Outside 07:00 Prague; no morning push."
          fi

  tracking:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */3 * * *' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: paragliding-tracking
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tracking syntax
        run: python -m py_compile tracking_delivery.py logistics.py forecast.py preferences.py
      - name: Install Web Push library
        run: python -m pip install "pywebpush>=2.0,<3"
      - name: Monitor watched windows and send due pushes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_TO: jmkozel@gmail.com
          PUSH_API_TOKEN: ${{ secrets.PUSH_API_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python tracking_delivery.py
