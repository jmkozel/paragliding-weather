name: Paragliding forecast and public web
on:
  schedule:
    # Refresh website every three hours, plus 07:00 local daily.
    - cron: '17 */3 * * *'
    - cron: '11,41 * * * *'
    - cron: '0 5,6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: paragliding-pages
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule != '11,41 * * * *' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile forecast.py build_site.py preferences.py morning_delivery.py morning_push.py logistics.py tracking_delivery.py pwa_assets.py push_delivery.py
      - name: Build public weather report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: python build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Send morning email only
        if: ${{ always() && !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_TO: jmkozel@gmail.com
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(TZ=Europe/Prague date +%H)" = "07" ]; then
            python morning_delivery.py
          else
            echo "Website refreshed; no email outside 07:00 Prague."
          fi

      - name: Install morning Web Push library
        if: ${{ success() }}
        run: python -m pip install "pywebpush>=2.0,<3"
      - name: Send morning mobile notification
        if: ${{ success() }}
        env:
          PUSH_API_TOKEN: ${{ secrets.PUSH_API_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ "$(TZ=Europe/Prague date +%H)" = "07" ]; then
            python morning_push.py || echo "Morning push failed; existing email delivery unchanged."
          else
            echo "Outside 07:00 Prague; no morning push."
          fi

  tracking:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: paragliding-tracking
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tracking syntax
        run: python -m py_compile tracking_delivery.py logistics.py forecast.py preferences.py
      - name: Install Web Push library
        run: python -m pip install "pywebpush>=2.0,<3"
      - name: Monitor watched windows and send due emails and pushes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_TO: jmkozel@gmail.com
          PUSH_API_TOKEN: ${{ secrets.PUSH_API_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python tracking_delivery.py
